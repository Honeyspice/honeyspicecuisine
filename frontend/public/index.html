<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Single icon declaration. There were previously two competing rel="icon"
         links, the ICO holding the brand mark and a 32x32 PNG holding a cropped
         food photograph, and the PNG was winning in most browsers. The ICO now
         carries the mark only, with no wordmark, since a wordmark is illegible
         below about 48px. -->
    <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F46A06" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Authentic Nigerian food in Stirling. Order for collection or delivery, or book HoneySpice to cater weddings, parties and events across the UK."
    />
    <!-- Social share card. Absolute URLs are required: %PUBLIC_URL% resolves to
         an empty string in the production build, and crawlers reject relative
         og:image paths, so the previous tags never rendered a preview at all.
         The image is the brand lockup on charcoal, not a food photograph, so the
         card stays a brand asset rather than a promotional banner. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HoneySpice Cuisine" />
    <meta property="og:url" content="https://honeyspicecuisine.co.uk/" />
    <meta property="og:title" content="HoneySpice Cuisine | Nigerian Food & Catering UK" />
    <meta
      property="og:description"
      content="Authentic Nigerian food in Stirling. Order for collection or delivery, or book HoneySpice to cater weddings, parties and events across the UK."
    />
    <meta property="og:image" content="https://honeyspicecuisine.co.uk/images/og-honeyspice.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="HoneySpice Cuisine logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HoneySpice Cuisine | Nigerian Food & Catering UK" />
    <meta
      name="twitter:description"
      content="Authentic Nigerian food in Stirling. Order for collection or delivery, or book HoneySpice to cater weddings, parties and events across the UK."
    />
    <meta name="twitter:image" content="https://honeyspicecuisine.co.uk/images/og-honeyspice.png" />
    <!-- 180x180 and fully opaque. iOS does not honour transparency and was
         previously pointed at a 32x32 PNG, so the home-screen icon was being
         upscaled 5.6x. -->
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <!-- Self-referencing canonical. Social and link crawlers generally do not
         execute the SPA, so this static tag is the only canonical many of them
         will see, and it points at the homepage. The Canonical component in
         App.js rewrites it per route for crawlers that do render JavaScript,
         Googlebot included. -->
    <link rel="canonical" href="https://honeyspicecuisine.co.uk/" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>HoneySpice Cuisine | Nigerian Food &amp; Catering UK</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
